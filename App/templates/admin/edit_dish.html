{% extends 'base.html' %} {% block content %} {% load static %}
<link rel="stylesheet" href="{% static 'App/add_restaurant.css' %}" />
<main class="page-wrapper">
  <div class="form-wrapper">
    <h1 class="form-title">Edit Dish</h1>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Dish Name -->
      <div class="input-container">
        <input
          type="text"
          name="name"
          class="input-field"
          placeholder="Dish Name"
          required
          value="{{dishList.name}}"
        />
        <label class="input-label">Dish Name</label>
        <span class="input-highlight"></span>
      </div>

      <!-- Image -->
      <div class="input-container">
        <input type="file" name="image" class="input-field" required />
        <label class="input-label">Dish Image</label>
        <span class="input-highlight"></span>
      </div>

      <!-- Price -->
      <div class="input-container">
        <input
          type="number"
          name="price"
          class="input-field"
          placeholder="Price"
          required
          value="{{dishList.price}}"
        />
        <label class="input-label">Price</label>
        <span class="input-highlight"></span>
      </div>

      <!-- Description -->
      <div class="input-container">
        <input
          type="text"
          name="description"
          class="input-field"
          placeholder="Description"
          value="{{dishList.description}}"
        />
        <label class="input-label">Description</label>
        <span class="input-highlight"></span>
      </div>

      <!-- Veg/Non Veg -->
     <div class="input-container">
  <select name="dish_type" class="input-field" required>
    <option value="veg" {% if dishList.dish_type == 'veg' %}selected{% endif %}>
      Veg
    </option>
    <option value="non-veg" {% if dishList.dish_type == 'non-veg' %}selected{% endif %}>
      Non-Veg
    </option>
  </select>
  <label class="input-label">Dish Type</label>
</div>


      <!-- Starters -->
      <div class="input-container">
  <select name="category" class="input-field" required>
    <option value="starter" {% if dishList.category == 'starter' %}selected{% endif %}>
      Starter
    </option>
    <option value="main" {% if dishList.category == 'main' %}selected{% endif %}>
      Main Course
    </option>
    <option value="dessert" {% if dishList.category == 'dessert' %}selected{% endif %}>
      Dessert
    </option>
    <option value="beverage" {% if dishList.category == 'beverage' %}selected{% endif %}>
      Beverage
    </option>
  </select>
  <label class="input-label">Category</label>
</div>


      <button type="submit">Save Dish</button>
    </form>
  </div>
</main>
{% endblock %}
