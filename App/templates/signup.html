{% extends 'base.html' %} {% block content %} {% load static %}
<link rel="stylesheet" href="{% static 'App/signup.css' %}" />
<main>
  <div class="container-fluid">
    <div class="container" id="container">
      <div class="container-fluid">
        <form class="auth" id="auth" method="post">
          {% csrf_token %}
          <h2 style="margin-bottom: 10px; font-size: 1.8rem">
            Create Your Account
          </h2>

          <div class="input-con">
            <div class="input-container">
              <input
                id="name"
                type="text"
                class="input-field"
                placeholder="Username"
                name="username"
                required
              />
              <label for="name" class="input-label">User Name</label>
              <span class="input-highlight"></span>
            </div>

            <div class="input-container">
              <input
                id="email"
                type="email"
                class="input-field"
                placeholder="Enter your email"
                name="email"
                required
              />
              <label for="email" class="input-label">Enter email</label>
              <span class="input-highlight"></span>
            </div>

            <div class="input-container">
              <input
                id="password"
                type="password"
                class="input-field"
                placeholder="Enter password"
                name="password"
                required
              />
              <label for="password" class="input-label">Enter password</label>
              <span class="input-highlight"></span>
            </div>

            <div class="input-container">
              <input
                id="copass"
                type="password"
                class="input-field"
                placeholder="Confirm password"
                name="confirm_password"
                required
              />
              <label for="copass" class="input-label"> Confirm password </label>
              <span class="input-highlight"></span>
            </div>
          </div>

          <button id="signUpBtn" type="submit">Sign Up</button>

          <p title="Login">
            Already have an account?
            <span>
              <a href="/profile" id="profile">Login here</a>
            </span>
            !
          </p>
        </form>
      </div>
    </div>
  </div>
</main>

{% endblock %}
