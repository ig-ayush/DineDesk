{% extends 'base.html' %} {% load static %} {% block content %}
<link rel="stylesheet" href="{% static 'App/profile.css' %}" />
<title>DineDesk &#8226; Profile</title>
<main>
  <div class="profile" id="profile">
    <div class="pro-pic" id="pro-pic"></div>
    <div class="info" id="info">
      <h1>{{ user.username }}</h1>
      <h3>{{ user.email }}</h3>
    </div>
    <div class="logOut">
      <a href="/logout-account">
        <button>Logout</button>
      </a>
    </div>
  </div>
</main>

<script src="{% static 'App/script.js' %}"></script>
{% endblock %}
